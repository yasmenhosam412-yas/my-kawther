name: elkawther
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  device_preview: ^1.2.0
  flutter_localizations:
    sdk: flutter
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.1.0
  get_it: ^8.0.3
  image_picker: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  pin_code_fields: ^8.0.1
  table_calendar: ^3.1.2
  provider: ^6.1.4
  dio: ^5.8.0+1
  native_dio_adapter: ^1.5.0
  json_annotation: ^4.9.0
  build_runner: ^2.4.15
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  intl_phone_field: ^3.2.0
  percent_indicator: ^4.2.5
  dotted_border: ^2.1.0
  carousel_slider: ^5.0.0
  rating_bar_flutter: ^1.0.2
  flutter_rating_bar: ^4.0.1
  file_picker: ^9.0.0
  intl_utils: ^2.8.10
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  flutter_holo_date_picker: ^2.0.0
  awesome_dialog: ^3.2.1
  font_awesome_flutter: ^10.8.0
  easy_localization: ^3.0.7+1
  pretty_dio_logger: ^1.4.0
  bounce: ^1.0.2
  shimmer: ^3.0.0
  pdf: ^3.10.1
  path_provider: ^2.1.2
  open_filex: ^4.3.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.0
  android_intent_plus: ^5.3.0
  device_info_plus: ^10.0.1
  permission_handler: ^12.0.1
  geolocator: ^10.1.0
  geocoding: ^2.2.0
  location: ^8.0.1
  dartz: ^0.10.1
  url_launcher: ^6.3.2
  chat_bubbles: ^1.7.0
  skeletonizer: ^2.1.0+1
  text_search: ^1.0.2
  connectivity_plus: ^7.0.0
  flutter_timezone: ^5.0.0
  fluttertoast: ^9.0.0
  share_plus: ^12.0.0
  app_links: ^6.4.1
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  color: "#F5FAFD"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  android_12:
    color: "#F5FAFD"
    image: assets/images/splash_logo.png
    icon_background_color: "#F5FAFD"

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0B76B9"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/anim/
    - assets/fonts/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

flutter_intl:
  enabled: true
